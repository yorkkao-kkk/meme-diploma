<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="catFurR" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <radialGradient id="catEyeGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="120" cy="245" rx="55" ry="9" fill="#000000" opacity="0.3" />

  <!-- Body & Torso -->
  <path d="M 65 130 C 60 215, 180 215, 175 130 C 175 75, 65 75, 65 130 Z" fill="url(#catFurR)" stroke="#0f172a" stroke-width="3" />

  <!-- Pointy Ears with pink inner -->
  <path d="M 72 95 L 45 28 C 65 35, 92 52, 100 75 Z" fill="url(#catFurR)" stroke="#0f172a" stroke-width="2.5" />
  <path d="M 168 95 L 195 28 C 175 35, 148 52, 140 75 Z" fill="url(#catFurR)" stroke="#0f172a" stroke-width="2.5" />
  <path d="M 74 88 L 56 46 L 90 72 Z" fill="#f43f5e" opacity="0.75" />
  <path d="M 166 88 L 184 46 L 150 72 Z" fill="#f43f5e" opacity="0.75" />

  <!-- Golden Big Eyes -->
  <ellipse cx="92" cy="102" rx="16" ry="19" fill="url(#catEyeGold)" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="148" cy="102" rx="16" ry="19" fill="url(#catEyeGold)" stroke="#0f172a" stroke-width="2" />
  <!-- Slit Pupils -->
  <ellipse cx="92" cy="102" rx="5" ry="14" fill="#000000" />
  <ellipse cx="148" cy="102" rx="5" ry="14" fill="#000000" />
  <!-- Eye highlights -->
  <circle cx="88" cy="95" r="4" fill="#ffffff" />
  <circle cx="144" cy="95" r="4" fill="#ffffff" />

  <!-- Iconic Warm Smiling Cat Mouth -->
  <path d="M 94 128 Q 120 152 146 128 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
  <ellipse cx="120" cy="138" rx="10" ry="6" fill="#f43f5e" />

  <!-- Whiskers -->
  <path d="M 50 115 L 18 110 M 50 125 L 20 128 M 50 135 L 22 144" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 190 115 L 222 110 M 190 125 L 220 128 M 190 135 L 218 144" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Clapping Paws (Clapping in front of chest) -->
  <path d="M 52 155 C 75 142, 102 165, 105 178 C 88 188, 55 185, 42 165 Z" fill="#334155" stroke="#0f172a" stroke-width="2.5" />
  <path d="M 188 155 C 165 142, 138 165, 135 178 C 152 188, 185 185, 198 165 Z" fill="#334155" stroke="#0f172a" stroke-width="2.5" />

  <!-- Clapping Spark & Impact stars (👏 啪啪啪掌聲特效) -->
  <circle cx="120" cy="172" r="12" fill="#fef08a" opacity="0.6" />
  <path d="M 120 152 L 120 192 M 100 172 L 140 172 M 106 158 L 134 186 M 134 158 L 106 186" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <circle cx="104" cy="172" r="6" fill="#fbbf24" />
  <circle cx="136" cy="172" r="6" fill="#fbbf24" />

  <!-- Feet -->
  <ellipse cx="95" cy="228" rx="14" ry="10" fill="#334155" stroke="#0f172a" stroke-width="2" />
  <ellipse cx="145" cy="228" rx="14" ry="10" fill="#334155" stroke="#0f172a" stroke-width="2" />
</svg>
