<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="120" cy="245" rx="65" ry="10" fill="#000000" opacity="0.25" />

  <!-- Classic Roblox Noob Figure (黃頭藍身綠腿經典造型) -->
  <!-- Green Legs -->
  <rect x="85" y="175" width="32" height="65" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="3" />
  <rect x="123" y="175" width="32" height="65" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="3" />

  <!-- Blue Torso Block -->
  <rect x="75" y="105" width="90" height="72" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="3.5" />

  <!-- Yellow Blocky Arms -->
  <rect x="42" y="108" width="30" height="65" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
  <rect x="168" y="108" width="30" height="65" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="3" />

  <!-- Yellow Cylindrical/Block Head -->
  <rect x="85" y="38" width="70" height="65" rx="14" fill="#facc15" stroke="#ca8a04" stroke-width="3.5" />
  <rect x="105" y="28" width="30" height="12" rx="4" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" />

  <!-- Classic Roblox Smile Face -->
  <!-- Dot Eyes -->
  <circle cx="104" cy="65" r="5" fill="#0f172a" />
  <circle cx="136" cy="65" r="5" fill="#0f172a" />
  <!-- Big Friendly Curved Smile -->
  <path d="M 102 78 Q 120 94 138 78" stroke="#0f172a" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- Roblox "R" Chest Logo -->
  <g transform="translate(108, 122) rotate(-15 12 12)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#ffffff" />
    <rect x="8" y="8" width="8" height="8" rx="2" fill="#dc2626" />
  </g>
</svg>
