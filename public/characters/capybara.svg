<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bathWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Wooden Onsen Tub / Bath ripples -->
  <ellipse cx="120" cy="235" rx="85" ry="20" fill="url(#bathWater)" stroke="#bae6fd" stroke-width="3" />
  <ellipse cx="120" cy="235" rx="70" ry="12" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

  <!-- Capybara Body -->
  <path d="M 60 160 C 60 95, 180 95, 180 160 C 180 220, 60 220, 60 160 Z" fill="url(#capyG)" stroke="#451a03" stroke-width="3.5" />
  <!-- Rounded Capy Head -->
  <path d="M 75 130 C 75 75, 165 75, 165 130 Z" fill="url(#capyG)" stroke="#451a03" stroke-width="3" />

  <!-- Capy Ears -->
  <ellipse cx="78" cy="92" rx="9" ry="7" fill="#78350f" stroke="#451a03" stroke-width="2" />
  <ellipse cx="162" cy="92" rx="9" ry="7" fill="#78350f" stroke="#451a03" stroke-width="2" />

  <!-- Iconic Capybara Snout (Boxy dark muzzle) -->
  <ellipse cx="120" cy="145" rx="26" ry="17" fill="#451a03" />
  <!-- Nostrils -->
  <ellipse cx="111" cy="143" rx="4" ry="7" fill="#1c1917" />
  <ellipse cx="129" cy="143" rx="4" ry="7" fill="#1c1917" />

  <!-- Extremely Serene Closed Eyes (極致鬆弛微閉雙眼) -->
  <path d="M 88 114 Q 100 106 110 114" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 130 114 Q 140 106 152 114" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Peaceful Little Smile -->
  <path d="M 112 165 Q 120 170 128 165" stroke="#1c1917" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Signature Yuzu / Orange Balanced on Head (頭頂溫泉柚子/橘子) -->
  <circle cx="120" cy="54" r="22" fill="#ea580c" stroke="#c2410c" stroke-width="2" />
  <!-- Leaf and stem -->
  <path d="M 120 32 Q 126 22 130 26" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <ellipse cx="132" cy="28" rx="8" ry="4" fill="#22c55e" transform="rotate(25 132 28)" />

  <!-- Onsen Steam Wisps -->
  <path d="M 50 170 Q 42 145 52 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 190 170 Q 198 145 188 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
