<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="120" cy="245" rx="55" ry="9" fill="#000000" opacity="0.25" />

  <!-- Giant Straw (斜戳封口膜吸管) -->
  <line x1="120" y1="18" x2="120" y2="225" stroke="#dc2626" stroke-width="18" stroke-linecap="round" />
  <line x1="116" y1="20" x2="116" y2="225" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />

  <!-- Cup Lid / Dome -->
  <ellipse cx="120" cy="72" rx="72" ry="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
  <path d="M 52 72 Q 120 42 188 72 Z" fill="#ffffff" opacity="0.8" stroke="#cbd5e1" stroke-width="2" />

  <!-- Plastic Cup Body with Milk Tea -->
  <polygon points="56,72 184,72 165,230 75,230" fill="url(#teaGrad)" stroke="#78350f" stroke-width="3.5" />
  <!-- Gloss reflection on cup -->
  <path d="M 68 85 L 82 220 L 92 220 L 78 85 Z" fill="#ffffff" opacity="0.25" />

  <!-- Cheerful Face on Cup -->
  <circle cx="102" cy="125" r="7" fill="#451a03" />
  <circle cx="138" cy="125" r="7" fill="#451a03" />
  <circle cx="104" cy="123" r="2.5" fill="#ffffff" />
  <circle cx="140" cy="123" r="2.5" fill="#ffffff" />
  <path d="M 114 135 Q 120 142 126 135" stroke="#451a03" stroke-width="3" fill="none" stroke-linecap="round" />
  <ellipse cx="94" cy="135" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />
  <ellipse cx="146" cy="135" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />

  <!-- Juicy Tapioca Pearls (黑糖波霸珍珠) -->
  <circle cx="95" cy="205" r="14" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <circle cx="125" cy="210" r="14" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <circle cx="148" cy="198" r="13" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <circle cx="110" cy="188" r="13" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <circle cx="82" cy="192" r="11" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <circle cx="138" cy="178" r="11" fill="#0f172a" stroke="#000000" stroke-width="1.5" />

  <!-- Pearl Gloss -->
  <circle cx="92" cy="200" r="3.5" fill="#ffffff" opacity="0.6" />
  <circle cx="122" cy="205" r="3.5" fill="#ffffff" opacity="0.6" />
  <circle cx="145" cy="193" r="3" fill="#ffffff" opacity="0.6" />
</svg>
